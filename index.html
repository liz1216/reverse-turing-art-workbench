<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#11151a">
    <title>图灵·美术工作台</title>
    <link rel="stylesheet" href="./gate.css">
    <script type="module" src="./unlock.js"></script>
  </head>
  <body>
    <main id="gate" class="gate-shell">
      <section class="gate-card" aria-labelledby="title">
        <p class="eyebrow">PRIVATE ART WORKBENCH</p>
        <h1 id="title">图灵·美术工作台</h1>
        <p class="intro">输入访问密码，进入本地美术工作台。</p>
        <form id="unlock-form">
          <label for="password">访问密码</label>
          <div class="input-row">
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button id="unlock" type="submit">解锁</button>
          </div>
          <p id="status" role="status" aria-live="polite"></p>
        </form>
        <p class="notice">模型、贴图与参数仅在本机浏览器预览，不上传。</p>
      </section>
    </main>

    <main id="unlocked" hidden>
      <div id="mount"></div>
      <button id="lock" class="lock-button" type="button">重新锁定</button>
    </main>
  </body>
</html>
